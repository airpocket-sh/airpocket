<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<title>Airpocket README banner</title>
<!-- The source of banner.png, the wide strip at the top of the README. It is the share card
     (site/og.html) laid out for a 1280x360 strip: the same map, grid, corner brackets, dart,
     wordmark and the launch page's first line, with the page's own fonts. Rendered by
     docs/reference/render-readme-images.js; nothing links to this file. -->
<style>
@font-face{font-family:'B612';font-weight:400;src:url("../../site/fonts/b612-400.woff2") format("woff2")}
@font-face{font-family:'B612 Mono';font-weight:400;src:url("../../site/fonts/b612-mono-400.woff2") format("woff2")}
@font-face{font-family:'IBM Plex Sans';font-weight:400;src:url("../../site/fonts/plex-400.woff2") format("woff2")}
html,body{margin:0;background:#0A0D08}
#card{position:relative;width:1280px;height:360px;overflow:hidden;background:#0A0D08;color:#E7E9DE;font-family:'B612',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#map{position:absolute;inset:0;background:url("../../site/map.svg") 50% 58%/1400px auto no-repeat;opacity:.9}
#grid{position:absolute;inset:0;opacity:.6;background-image:linear-gradient(rgba(231,233,222,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(231,233,222,.035) 1px,transparent 1px);background-size:60px 60px;background-position:20px 0}
.br{position:absolute;width:28px;height:28px}
.br.tl{left:24px;top:24px;border-left:1px solid #D7C49E;border-top:1px solid #D7C49E}
.br.tr{right:24px;top:24px;border-right:1px solid #D7C49E;border-top:1px solid #D7C49E}
.br.bl{left:24px;bottom:24px;border-left:1px solid #D7C49E;border-bottom:1px solid #D7C49E}
.br.br{right:24px;bottom:24px;border-right:1px solid #D7C49E;border-bottom:1px solid #D7C49E}
.read{position:absolute;top:34px;white-space:nowrap;font-family:'B612 Mono',ui-monospace,monospace;font-size:13px;letter-spacing:.16em;color:#929A83}
.read.l{left:66px}
.read.r{right:66px;color:#8FD14F}
#host{position:absolute;left:66px;bottom:32px;font-family:'B612 Mono',ui-monospace,monospace;font-size:13px;letter-spacing:.16em;color:#929A83}
#bar{position:absolute;right:66px;bottom:38px;width:360px;height:2px;background:#D7C49E}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#group{--fs:76px;--dart:calc(var(--fs)*1.8);--gap:calc(var(--fs)*.2);display:flex;flex-direction:column;align-items:flex-start;margin-top:-4px}
#brand{display:flex;align-items:center;gap:var(--gap)}
#brand svg{width:var(--dart);height:var(--dart);flex:none;overflow:visible;filter:drop-shadow(0 0 4px rgba(215,196,158,.6))}
#word{font-size:var(--fs);letter-spacing:.12em;line-height:1;white-space:nowrap}
#tag{margin-left:calc(var(--dart) + var(--gap));margin-top:calc(22px - var(--fs)*.5);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:26px;line-height:1.3;color:#AEB5A1}
</style>
</head>
<body>
<div id="card">
  <div id="map"></div>
  <div id="grid"></div>
  <i class="br tl"></i><i class="br tr"></i><i class="br bl"></i><i class="br br"></i>
  <div class="read l">AIRPOCKET · MULTI-SESSION DISPLAY</div>
  <div class="read r">ON STATION</div>
  <div id="stage">
    <div id="group">
      <div id="brand"><svg viewBox="0 0 24 24" fill="none" stroke="#D7C49E" stroke-width=".9" stroke-linejoin="round"><path d="M5.5 18.5l13-6.5-13-6.5v4.2l7 2.3-7 2.3z"/></svg><span id="word">AIRPOCKET</span></div>
      <div id="tag">Your agents fly the missions. This is the cockpit.</div>
    </div>
  </div>
  <div id="host">AIRPOCKET.SH</div>
  <div id="bar"></div>
</div>
</body>
</html>
