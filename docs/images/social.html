<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<title>Airpocket social card</title>
<!-- The source of social-preview.png, the picture GitHub shows when a link to the
     repository is shared. It is the launch page's share card (site/og.html) at the size
     GitHub asks for, 1280x640, with the same map, brackets, dart, wordmark and fonts.
     Rendered by docs/reference/render-readme-images.js; upload it by hand in the
     repository's Settings, under Social preview. Nothing links to this file. -->
<style>
@font-face{font-family:'B612';font-weight:400;src:url("../../site/fonts/b612-400.woff2") format("woff2")}
@font-face{font-family:'B612 Mono';font-weight:400;src:url("../../site/fonts/b612-mono-400.woff2") format("woff2")}
@font-face{font-family:'IBM Plex Sans';font-weight:400;src:url("../../site/fonts/plex-400.woff2") format("woff2")}
html,body{margin:0;background:#0A0D08}
#card{position:relative;width:1280px;height:640px;overflow:hidden;background:#0A0D08;color:#E7E9DE;font-family:'B612',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#map{position:absolute;inset:0;background:url("../../site/map.svg") 50% 60%/1320px auto no-repeat;opacity:.9}
#grid{position:absolute;inset:0;opacity:.6;background-image:linear-gradient(rgba(231,233,222,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(231,233,222,.035) 1px,transparent 1px);background-size:60px 60px;background-position:0 15px}
.br{position:absolute;width:36px;height:36px}
.br.tl{left:28px;top:28px;border-left:1px solid #D7C49E;border-top:1px solid #D7C49E}
.br.tr{right:28px;top:28px;border-right:1px solid #D7C49E;border-top:1px solid #D7C49E}
.br.bl{left:28px;bottom:28px;border-left:1px solid #D7C49E;border-bottom:1px solid #D7C49E}
.br.br{right:28px;bottom:28px;border-right:1px solid #D7C49E;border-bottom:1px solid #D7C49E}
.tick{position:absolute;top:30%;bottom:30%;width:8px;background:repeating-linear-gradient(180deg,#626E57 0 1px,transparent 1px 12px)}
.tick.l{left:28px}.tick.r{right:28px}
.read{position:absolute;top:40px;white-space:nowrap;font-family:'B612 Mono',ui-monospace,monospace;font-size:14px;letter-spacing:.16em;color:#929A83}
.read.l{left:76px}
.read.r{right:76px;color:#8FD14F}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#group{--fs:92px;--dart:calc(var(--fs)*1.8);--gap:calc(var(--fs)*.2);display:flex;flex-direction:column;align-items:flex-start;margin-top:6px}
#brand{display:flex;align-items:center;gap:var(--gap)}
#brand svg{width:var(--dart);height:var(--dart);flex:none;overflow:visible;filter:drop-shadow(0 0 4px rgba(215,196,158,.6))}
#word{font-size:var(--fs);letter-spacing:.12em;line-height:1;white-space:nowrap}
#tag{margin-left:calc(var(--dart) + var(--gap));margin-top:calc(26px - var(--fs)*.5);display:flex;flex-direction:column;gap:18px}
#tag .ln{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:30px;line-height:1.3;color:#AEB5A1}
#chips{display:flex;gap:10px;font-family:'B612 Mono',ui-monospace,monospace;font-size:15px;letter-spacing:.14em}
#chips span{height:32px;padding:0 12px;display:inline-flex;align-items:center;border:1px solid #626E57;color:#929A83}
#chips span.on{border-color:#8FD14F;color:#8FD14F}
#bar{position:absolute;left:76px;right:76px;bottom:44px;height:2px;background:#2B3327}
#bar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:#D7C49E}
#host{position:absolute;left:76px;bottom:58px;font-family:'B612 Mono',ui-monospace,monospace;font-size:14px;letter-spacing:.16em;color:#929A83}
</style>
</head>
<body>
<div id="card">
  <div id="map"></div>
  <div id="grid"></div>
  <i class="br tl"></i><i class="br tr"></i><i class="br bl"></i><i class="br br"></i>
  <i class="tick l"></i><i class="tick r"></i>
  <div class="read l">AIRPOCKET · MULTI-SESSION DISPLAY</div>
  <div class="read r">ON STATION</div>
  <div id="stage">
    <div id="group">
      <div id="brand"><svg viewBox="0 0 24 24" fill="none" stroke="#D7C49E" stroke-width=".9" stroke-linejoin="round"><path d="M5.5 18.5l13-6.5-13-6.5v4.2l7 2.3-7 2.3z"/></svg><span id="word">AIRPOCKET</span></div>
      <div id="tag">
        <div class="ln">Your agents fly the missions. This is the cockpit.</div>
        <div id="chips"><span class="on">MIT</span><span>NO CLOUD</span><span>YOUR TAILNET</span></div>
      </div>
    </div>
  </div>
  <div id="host">AIRPOCKET.SH</div>
  <div id="bar"><i></i></div>
</div>
</body>
</html>
