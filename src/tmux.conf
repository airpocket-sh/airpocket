# Airpocket's tmux, for `airpocket run`: a private server on Airpocket's own
# socket (never your default tmux server, and never ~/.tmux.conf), set up so
# that it stays out of sight and the agent feels as if it ran in your own
# terminal.

# No status bar, no prefix key: nothing of tmux on screen, and Ctrl+B stays the
# agent's. Closing the window detaches; `airpocket attach` brings it back.
set -g status off
set -g prefix None
set -g prefix2 None
unbind-key -a -T prefix

# Esc reaches the agent at once (tmux's default waits to see if more follows).
set -s escape-time 0

# Shift+Enter and other modified keys: ask the terminal for them, and pass
# them on in the kitty (CSI u) form. "always", because Codex asks for the kitty
# keyboard protocol, which tmux doesn't take as a request: with "on" it would
# get Shift+Enter as a plain Enter and send the prompt. Plain Ctrl keys still
# go as their usual bytes to an agent that didn't ask for more.
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features ',*:extkeys'

# True colour, and a terminal type the agents know.
set -g default-terminal tmux-256color
set -as terminal-features ',*:RGB'

# The mouse wheel scrolls back through the output (tmux's copy mode), and
# scrolling down to the end leaves it. So does typing: any key tmux doesn't
# use for scrolling leaves scrollback and goes on to the agent, as in a plain
# terminal (Ctrl+V too, for pasting an image). Esc and Ctrl+C only leave it, so
# they never interrupt the agent by surprise.
set -g mouse on
set -g history-limit 50000
set -g focus-events on
set -gw mode-keys emacs
unbind-key -T copy-mode Space
unbind-key -T copy-mode ,
unbind-key -T copy-mode \;
unbind-key -T copy-mode F
unbind-key -T copy-mode N
unbind-key -T copy-mode P
unbind-key -T copy-mode R
unbind-key -T copy-mode T
unbind-key -T copy-mode X
unbind-key -T copy-mode f
unbind-key -T copy-mode g
unbind-key -T copy-mode n
unbind-key -T copy-mode q
unbind-key -T copy-mode r
unbind-key -T copy-mode t
unbind-key -T copy-mode C-v
bind-key -T copy-mode Any if-shell -F 1 "send-keys -X cancel ; send-keys"

# Copying a selection puts it on the Mac's clipboard: through the terminal
# (OSC 52) where the terminal allows it, and through pbcopy always.
set -s set-clipboard on
set -as terminal-features ',*:clipboard'
set -s copy-command /usr/bin/pbcopy

# When the agent exits, its window closes and your terminal gets its prompt back.
set -g remain-on-exit off
set -g detach-on-destroy on
